services:
  postgres:
    image: postgres:17-alpine
    container_name: rivaia-auth-db
    environment:
      POSTGRES_DB: rivaia_auth
      POSTGRES_USER: ${DB_USER:-rivaia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rivaia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rivaia} -d rivaia_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
